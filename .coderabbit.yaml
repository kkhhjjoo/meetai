# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR" # 리뷰를 한국어로
early_access: false

reviews:
  profile: "chill" # chill | assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/drizzle/**" # 마이그레이션 생성 파일
  path_instructions:
    - path: "src/**/*.{ts,tsx}"
      instructions: |
        Next.js App Router + TypeScript 프로젝트입니다.
        서버/클라이언트 컴포넌트 구분, 타입 안정성, 불필요한 리렌더링을 중점적으로 봐주세요.
    - path: "src/lib/auth*.ts"
      instructions: "Better Auth 설정입니다. 보안상 문제(시크릿 노출, 세션 처리)를 확인해주세요."

chat:
  auto_reply: true
